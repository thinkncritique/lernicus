<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernicus · Schatzkarte</title>
<link rel="icon" href="logo.png">
<meta name="description" content="Lernicus: Der Lernpfad zur Kurvendiskussion als Schatzkarte – Definitionsbereich, Achsenschnittpunkte und Symmetrie spielerisch verstehen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="lernicus.css">
<style>
/* Layout: Kopfzeile mit Logo; darunter entweder die Schatzkarte (Lernpfad) oder eine geöffnete Station. */
.wrap.app { max-width: 680px; }
.pathhead h1 { margin-top: 0; }
.overall { display: flex; align-items: center; gap: 12px; }
.bar { flex: 1; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--yes); border-radius: 99px; transition: width .6s ease; }
.overall span { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* Schatzkarte */
.tmap { position: relative; aspect-ratio: 400 / 540; border-radius: 14px; overflow: hidden; border: 2px solid var(--parch-line); background: var(--parch); box-shadow: inset 0 0 60px rgba(120, 80, 20, .18); }
.tmap > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tm-sea { fill: var(--sea); }
.tm-land { fill: var(--parch); stroke: var(--parch-line); stroke-width: 2; }
.tm-wave { fill: none; stroke: var(--parch-line); stroke-width: 1.5; stroke-linecap: round; opacity: .8; }
.tm-deco { fill: none; stroke: var(--parch-line); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tm-text { fill: var(--parch-ink); font: 600 11px var(--font-body); letter-spacing: .18em; text-transform: uppercase; opacity: .75; }
.tm-seg { fill: none; stroke-width: 5; stroke-linecap: round; }
.tm-seg.todo { stroke: var(--parch-line); stroke-dasharray: 2 11; }
.tm-seg.done { stroke: var(--trail); stroke-dasharray: 14 9; }
.tm-x { stroke: var(--trail); stroke-width: 6; stroke-linecap: round; }
.tm-x.todo { stroke: var(--parch-line); }

.node { position: absolute; transform: translate(-50%, -50%); width: 17%; aspect-ratio: 1; min-width: 60px; border-radius: 50%; display: grid; place-items: center;
  font-size: clamp(1.7rem, 6vw, 2.3rem); border: 4px solid; background: var(--surface); padding: 0; z-index: 2; }
.node .badge { position: absolute; right: -6px; top: -6px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .85rem; font-weight: 800; border: 2px solid var(--parch); }
.node.done { border-color: var(--yes); background: var(--yes-bg); }
.node.done .badge { background: var(--yes); color: #fff; }
.node.current { border-color: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); animation: pulse 2s ease-out infinite; }
.node.current .badge { background: var(--accent); color: var(--accent-ink); font-size: .7rem; }
.node.locked { border-color: var(--parch-line); border-style: dashed; background: var(--locked); cursor: not-allowed; }
.node.locked .emo { filter: grayscale(1); opacity: .45; }
.node.locked .badge { background: var(--parch2); font-size: .8rem; }
.node:not(.locked):hover { transform: translate(-50%, -50%) scale(1.06); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 80%, 100% { box-shadow: 0 0 0 18px transparent; } }

.nlabel { position: absolute; width: 44%; background: var(--surface); border: 1px solid var(--parch-line); border-radius: 10px; padding: 8px 10px; z-index: 1; box-shadow: 0 2px 0 var(--parch-line); }
.nlabel small { display: block; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.nlabel b { display: block; font-family: var(--font-display); font-size: clamp(.95rem, 3.6vw, 1.15rem); line-height: 1.15; }
.nlabel .st { display: inline-block; margin-top: 4px; font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; }
.nlabel.done .st { background: var(--yes-bg); color: var(--yes); }
.nlabel.current .st { background: var(--hint-bg); color: var(--accent); }
.nlabel.locked { opacity: .8; }
.nlabel.locked .st { background: var(--locked); color: var(--muted); }
.goalchest { position: absolute; transform: translate(-50%, -50%); z-index: 1; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: .95rem; z-index: 99; max-width: calc(100% - 32px); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 50%; border: 3px solid; display: inline-block; }
.legend .l1 { border-color: var(--yes); background: var(--yes-bg); }
.legend .l2 { border-color: var(--accent); }
.legend .l3 { border-color: var(--parch-line); border-style: dashed; background: var(--locked); }
.finale { display: flex; gap: 14px; align-items: center; }

/* Station */
.crumbs { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .9rem; }
.crumbs a { font-weight: 600; text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs span { color: var(--muted); }
.st-head { display: flex; gap: 14px; align-items: center; }
.st-icon { width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 2rem; border: 4px solid var(--accent); background: var(--surface); }
.st-icon.done { border-color: var(--yes); background: var(--yes-bg); }
.st-head small { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.st-head h1 { font-size: clamp(1.7rem, 7vw, 2.4rem); margin: 0; }
.goal { margin: 0; padding: 10px 14px; border-radius: 8px; background: var(--hint-bg); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
.card h2 { margin: 0; font-family: var(--font-display); font-size: 1.25rem; }
.card p, .card ul, .card ol { margin: 0; }
.card ul, .card ol { padding-left: 1.2em; display: grid; gap: 6px; }
details.card summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 1.25rem; list-style-position: outside; }
details.card[open] summary { margin-bottom: 4px; }
.worked { display: grid; gap: 8px; counter-reset: w; }
.worked > div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.worked > div::before { counter-increment: w; content: counter(w); width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--bg); font-weight: 700; font-size: .8rem; }
.eq { font-family: var(--font-mono); font-weight: 500; background: var(--bg); border-radius: 6px; padding: 4px 8px; display: inline-block; }
.play h2 { margin: 0 0 4px; font-family: var(--font-display); font-size: 1.35rem; }
.st-done { border: 2px solid var(--yes); background: var(--yes-bg); border-radius: 12px; padding: 18px; display: grid; gap: 10px; }
.st-done h2 { margin: 0; font-family: var(--font-display); }
.st-done .row { grid-template-columns: 1fr 1fr; }
.formula-inline { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap app">
  <header>
    <div class="head-left">
      <span class="brand">Lernicus · Kurvendiskussion</span>
      <span class="score" id="coins" aria-live="polite"></span>
    </div>
    <a class="logo" href="#/" aria-label="Zur Schatzkarte"><img src="logo.png" alt="Lernicus Logo" width="360" height="324"></a>
  </header>
  <div id="view" class="wrap" style="max-width:none;width:100%"></div>
</div>

<script src="lernicus-core.js"></script>
<script src="darf-x-rein.js"></script>
<script src="station-achsen.js"></script>
<script src="station-symmetrie.js"></script>
<script>
(function () {
  var KEY = 'lernicus-schatzkarte-v1';
  var view = document.getElementById('view');
  var frac = function (a, b) { return '<span class="frac"><span>' + a + '</span><span>' + b + '</span></span>'; };

  var STATIONS = [
    { icon: '🚪', topic: 'Definitionsbereich', title: 'Darf x rein?', unit: 'Runde', module: function () { return window.LernicusDarfXRein; },
      goal: 'Verstehen und bestimmen, welche reellen x-Werte in eine Funktion eingesetzt werden dürfen.',
      explain: '<p>Stell dir eine Funktion als Club vor. Die Zahlen sind Gäste. Der <b>Definitionsbereich D<sub>f</sub></b> ist die Gästeliste: alle reellen x, für die man f(x) ausrechnen kann.</p>' +
        '<ul><li><b>Polynome</b> wie <span class="formula-inline">x² + 3</span> oder <span class="formula-inline">2x − 5</span>: Jede reelle Zahl darf rein. D<sub>f</sub> = ℝ.</li>' +
        '<li><b>Brüche</b>: Der Nenner darf nie null werden. Setze den Nenner gleich null, löse die Gleichung und schließe diese Zahl aus.</li></ul>',
      example: '<p>Bestimme den Definitionsbereich von <span class="formula-inline">f(x) = ' + frac(5, 'x + 4') + '</span>.</p><div class="worked">' +
        '<div><p>Nenner gleich null setzen: <span class="eq">x + 4 = 0 ⇔ x = −4</span></p></div>' +
        '<div><p>Diese Zahl ausschließen: <span class="eq">D<sub>f</sub> = ℝ \\ {−4}</span>, gesprochen „ℝ ohne −4“.</p></div>' +
        '<div><p>Probe: x = −3,9 ergibt den Nenner 0,1. Das ist erlaubt. Nur genau −4 muss draußen bleiben.</p></div></div>' },
    { icon: '🎯', topic: 'Achsenschnittpunkte', title: 'Schatzsuche im Koordinatensystem', unit: 'Runde', module: function () { return window.LernicusAchsen; },
      goal: 'Nullstellen mit f(x) = 0 und den y-Achsenschnittpunkt mit f(0) berechnen.',
      explain: '<p>Der Graph ist eine Schatzkarte. Die Schätze liegen dort, wo er die Koordinatenachsen trifft.</p>' +
        '<ul><li><b>Nullstellen</b> (x-Achse): Dort ist y = 0. Du löst <span class="formula-inline">f(x) = 0</span>.</li>' +
        '<li><b>y-Achsenschnittpunkt</b>: Dort ist x = 0. Du berechnest <span class="formula-inline">f(0)</span>.</li>' +
        '<li>Ein Punkt im Ursprung (0 | 0) liegt auf beiden Achsen und zählt als <b>ein</b> Fund.</li></ul>',
      example: '<p>Achsenschnittpunkte von <span class="formula-inline">f(x) = x² − 1</span>:</p><div class="worked">' +
        '<div><p>Nullstellen: <span class="eq">x² − 1 = 0 ⇔ x² = 1 ⇔ x = −1 oder x = 1</span>. Punkte: (−1 | 0) und (1 | 0).</p></div>' +
        '<div><p>y-Achse: <span class="eq">f(0) = 0² − 1 = −1</span>. Punkt: (0 | −1).</p></div></div>' },
    { icon: '🪞', topic: 'Symmetrie', title: 'Spiegel und Zauberuhr', unit: 'Runde', module: function () { return window.LernicusSymmetrie; },
      goal: 'Achsensymmetrie zur y-Achse und Punktsymmetrie zum Ursprung mit Spiegel und Zauberuhr untersuchen, erkennen und rechnerisch begründen.',
      explain: '<ul><li>🪞 <b>Spiegel</b> (Achsensymmetrie zur y-Achse): Aus (x | y) wird (−x | y). Rechnerisch: <span class="formula-inline">f(−x) = f(x)</span>.</li>' +
        '<li>🔄 <b>Zauberuhr</b> (Punktsymmetrie zum Ursprung): Aus (x | y) wird (−x | −y), eine Drehung um 180°. Rechnerisch: <span class="formula-inline">f(−x) = −f(x)</span>.</li></ul>' +
        '<p class="callout">Teste jeden Graphen mit beiden Werkzeugen und entscheide dann. Eine andere Spiegelachse als die y-Achse zählt nicht, und einzelne passende Punktpaare sind nur <b>Hinweise</b>.</p>',
      example: '<p>Prüfe <span class="formula-inline">f(x) = x⁴ − 2x²</span> auf Symmetrie.</p><div class="worked">' +
        '<div><p>−x einsetzen: <span class="eq">f(−x) = (−x)⁴ − 2·(−x)² = x⁴ − 2x²</span></p></div>' +
        '<div><p>Vergleichen: Das ist genau f(x). Also gilt <span class="eq">f(−x) = f(x)</span> für alle x.</p></div>' +
        '<div><p>Ergebnis: Der Graph ist achsensymmetrisch zur y-Achse. Zum Vergleich: Bei g(x) = x³ − x gilt g(−x) = −x³ + x = −g(x), also Punktsymmetrie.</p></div></div>' }
  ];

  var st = load();
  function load() {
    var d = { done: [false, false, false], coins: [0, 0, 0] };
    try { var j = JSON.parse(localStorage.getItem(KEY)); if (j && j.done) { d.done = j.done.slice(0, 3); d.coins = (j.coins || [0, 0, 0]).slice(0, 3); } } catch (e) {}
    return d;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  function status(i) { return st.done[i] ? 'done' : (i === 0 || st.done[i - 1]) ? 'current' : 'locked'; }
  function unlocked(i) { return status(i) !== 'locked'; }
  function totalCoins() { return st.coins.reduce(function (a, b) { return a + b; }, 0); }
  function updateCoins() { var c = totalCoins(); document.getElementById('coins').innerHTML = c ? '🪙 Schatz gesamt: <b>' + c + '</b> Münzen' : 'Lernpfad Schatzkarte'; }

  function toast(t) {
    var el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t;
    document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2600);
  }

  /* ---------- Schatzkarte ---------- */
  var POS = [[96, 118], [300, 268], [104, 418]];
  var SEGS = ['M96 118 C 150 200, 262 170, 300 268', 'M300 268 C 336 350, 170 330, 104 418', 'M104 418 C 140 500, 262 505, 318 478'];
  function mapView() {
    var n = st.done.filter(Boolean).length, all = n === 3;
    var svg = '<svg viewBox="0 0 400 540" aria-hidden="true" focusable="false">' +
      '<rect class="tm-sea" width="400" height="540"/>' +
      '<path class="tm-land" d="M40 70 C 30 30, 120 22, 170 40 C 230 60, 300 30, 350 70 C 392 104, 380 170, 362 220 C 348 262, 390 300, 372 352 C 356 400, 384 470, 340 512 C 300 548, 200 520, 140 522 C 80 524, 30 500, 26 450 C 22 400, 48 360, 40 312 C 32 262, 10 220, 22 170 C 30 130, 50 108, 40 70 Z"/>' +
      '<path class="tm-wave" d="M8 24 q6 -6 12 0 q6 6 12 0 M352 20 q6 -6 12 0 q6 6 12 0 M6 270 q6 -6 12 0 q6 6 12 0 M376 420 q6 -6 12 0 q6 6 12 0 M12 520 q6 -6 12 0 q6 6 12 0"/>' +
      '<g class="tm-deco"><path d="M200 120 l14 -22 l14 22 M222 120 l12 -18 l12 18"/><path d="M196 400 l10 -16 l10 16"/>' +
      '<path d="M60 230 q8 -26 4 -40 M64 190 q-14 -4 -20 6 M64 190 q12 -8 22 0 M64 190 q-2 -12 -12 -14"/>' +
      '<path d="M250 380 q8 -26 4 -40 M254 340 q-14 -4 -20 6 M254 340 q12 -8 22 0"/></g>' +
      '<g transform="translate(336 120)"><circle r="24" class="tm-deco"/><path d="M0 -30 L6 0 L0 30 L-6 0 Z" fill="var(--trail)" opacity=".8"/><path d="M-30 0 L0 5 L30 0 L0 -5 Z" fill="var(--parch-line)"/><text class="tm-text" y="-34" text-anchor="middle">N</text></g>' +
      '<text class="tm-text" x="200" y="60" text-anchor="middle">Insel der Kurvendiskussion</text>' +
      SEGS.map(function (d, i) { return '<path class="tm-seg ' + (st.done[i] ? 'done' : 'todo') + '" d="' + d + '"/>'; }).join('') +
      (all ? '' : '<path class="tm-x todo" d="M306 466 L330 490 M330 466 L306 490"/>') +
      '</svg>';
    var nodes = STATIONS.map(function (S, i) {
      var c = status(i), p = POS[i];
      var badge = c === 'done' ? '✓' : c === 'current' ? 'Los' : '🔒';
      var stt = c === 'done' ? '✓ Abgeschlossen' : c === 'current' ? '▶ Aktuelle Station' : '🔒 Gesperrt';
      var aria = 'Station ' + (i + 1) + ': ' + S.topic + ', ' + stt.replace(/^[^ ]+ /, '');
      var lblPos = i === 1 ? 'right:' + ((400 - p[0] + 44) / 4) + '%;top:' + ((p[1] - 34) / 5.4) + '%;text-align:right' : 'left:' + ((p[0] + 44) / 4) + '%;top:' + ((p[1] - 34) / 5.4) + '%';
      return '<button class="node ' + c + '" style="left:' + (p[0] / 4) + '%;top:' + (p[1] / 5.4) + '%" data-go="' + i + '" aria-label="' + aria + '"' + (c === 'locked' ? ' aria-disabled="true"' : '') + '><span class="emo">' + S.icon + '</span><span class="badge" aria-hidden="true">' + badge + '</span></button>' +
        '<div class="nlabel ' + c + '" style="' + lblPos + '"><small>Station ' + (i + 1) + '</small><b>' + S.topic + '</b><span class="st">' + stt + '</span></div>';
    }).join('');
    var chest = all ? '<div class="goalchest" style="left:' + (334 / 4) + '%;top:' + (490 / 5.4) + '%;z-index:3">' + LC.chest(true, 56) + '</div>' : '';
    var next = st.done.indexOf(false);
    var intro = all ? '<div class="st-done finale">' + LC.chest(true, 48) + '<div><h2>Schatz gefunden!</h2><p style="margin:0">Du hast alle drei Stationen geschafft und <b>' + totalCoins() + ' Münzen</b> gesammelt. Weitere Themen der Kurvendiskussion folgen bald. Du kannst jede Station wiederholen.</p></div></div>'
      : '<p class="sub" style="margin:0">' + (n === 0 ? 'Folge dem Weg über die Insel. Jede Station ist ein kleines Abenteuer mit Erklärung, Beispiel und Spiel. Kein Zeitdruck, keine Leben, die du verlieren kannst.' : 'Stark! Weiter geht es mit Station ' + (next + 1) + ': ' + STATIONS[next].topic + '.') + '</p>';
    view.innerHTML =
      '<div class="pathhead"><h1>Die Schatzkarte</h1></div>' + intro +
      '<div class="overall"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="' + n + '" aria-label="Fortschritt auf dem Lernpfad"><i style="width:' + (n / 3 * 100) + '%"></i></div><span>' + n + ' von 3 Stationen</span></div>' +
      '<div class="tmap">' + svg + chest + nodes + '</div>' +
      '<div class="legend" aria-hidden="true"><span><i class="l1"></i>abgeschlossen</span><span><i class="l2"></i>aktuell</span><span><i class="l3"></i>gesperrt</span></div>' +
      '<p class="fine">Dein Fortschritt wird in diesem Browser gespeichert. <button class="linkbtn" data-reset>Fortschritt zurücksetzen</button></p>';
  }

  /* ---------- Station ---------- */
  function stationView(i) {
    var S = STATIONS[i], c = status(i);
    view.innerHTML =
      '<nav class="crumbs"><a href="#/">← Zur Schatzkarte</a><span>Station ' + (i + 1) + ' von 3</span></nav>' +
      '<div class="st-head"><span class="st-icon' + (c === 'done' ? ' done' : '') + '" aria-hidden="true">' + S.icon + '</span><div><small>Station ' + (i + 1) + ' · ' + S.topic + (c === 'done' ? ' · ✓ abgeschlossen' : '') + '</small><h1>' + S.title + '</h1></div></div>' +
      '<div class="overall"><div class="bar" role="progressbar" aria-label="Fortschritt in dieser Station"><i id="stbar"></i></div><span id="sttext"></span></div>' +
      '<p class="goal"><b>Lernziel:</b> ' + S.goal + '</p>' +
      '<section class="card"><h2>Kurz erklärt</h2>' + S.explain + '</section>' +
      '<details class="card"' + (c === 'done' ? '' : ' open') + '><summary>Vorgerechnetes Beispiel</summary>' + S.example + '</details>' +
      '<section class="play"><h2>Jetzt spielen</h2><div id="game"></div></section>' +
      '<div id="stdone"></div>';
    var bar = document.getElementById('stbar'), txt = document.getElementById('sttext');
    S.module().mount(document.getElementById('game'), {
      onProgress: function (d, t) { bar.style.width = (d / t * 100) + '%'; txt.textContent = d + ' von ' + t + ' ' + S.unit + 'n'; },
      onFinish: function (coins) {
        var first = !st.done[i];
        st.done[i] = true; st.coins[i] = Math.max(st.coins[i] || 0, coins || 0); save(); updateCoins();
        var nx = i + 1 < 3;
        var el = document.getElementById('stdone');
        el.innerHTML = '<div class="st-done" role="status"><h2>' + (first ? '🎉 Station ' + (i + 1) + ' geschafft!' : '✓ Station wiederholt') + '</h2>' +
          '<p style="margin:0">' + (nx ? (first ? 'Auf der Schatzkarte ist jetzt Station ' + (i + 2) + ' freigeschaltet: ' + STATIONS[i + 1].topic + '.' : 'Weiter geht es mit Station ' + (i + 2) + '.') : 'Du hast den ganzen Lernpfad geschafft. Auf der Karte wartet der Schatz!') + '</p>' +
          '<div class="row">' + (nx ? '<a class="btn go" style="text-align:center;text-decoration:none" href="#/' + (i + 2) + '">Weiter zu Station ' + (i + 2) + ' ' + STATIONS[i + 1].icon + '</a>' : '<a class="btn go" style="text-align:center;text-decoration:none" href="#/">Zum Schatz ✕</a>') +
          '<a class="btn" style="text-align:center;text-decoration:none" href="#/">Zur Schatzkarte</a></div></div>';
        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }

  function route() {
    var m = location.hash.match(/^#\/([1-3])$/);
    if (m) {
      var i = +m[1] - 1;
      if (!unlocked(i)) { location.replace('#/'); toast('Diese Station ist noch gesperrt. Schließe zuerst Station ' + i + ' ab.'); return; }
      stationView(i);
    } else mapView();
    updateCoins();
    window.scrollTo(0, 0);
  }

  view.addEventListener('click', function (e) {
    var n = e.target.closest('[data-go]');
    if (n) {
      var i = +n.dataset.go;
      if (!unlocked(i)) { toast('🔒 Gesperrt: Schließe zuerst Station ' + i + ' (' + STATIONS[i - 1].topic + ') ab.'); return; }
      location.hash = '#/' + (i + 1); return;
    }
    if (e.target.closest('[data-reset]')) {
      st = { done: [false, false, false], coins: [0, 0, 0] }; save(); route(); toast('Fortschritt zurückgesetzt.');
    }
  });
  window.addEventListener('hashchange', route);
  route();
})();
